name: CI

# Every push to main and every pull request: types, the unit tests (format,
# crypto and its fixed vectors, tree, payload, texts), the build, and the
# checks a release relies on. The interface package is kept for a week, so a
# reviewer can install exactly what a pull request builds (Admin → Plugins →
# Apps → Install an app → Upload files: filex-app.json + ui.zip).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: The Python reference agrees with the committed test vectors
        run: |
          pip install --quiet cryptography
          python tools/fxtxt_ref.py vectors /tmp/vectors.json
          diff -u tests/vectors/container-v1.json /tmp/vectors.json

      - name: Build ui.zip
        run: npm run build

      - name: THIRD_PARTY_LICENSES.txt is current
        run: git diff --exit-code -- THIRD_PARTY_LICENSES.txt

      # The check the Release workflow makes on a tag, made on every push: a
      # hash that only matches on the author's machine is found here, not
      # after the tag is out.
      - name: The committed sha256 is this build's
        run: |
          built="$(cut -d' ' -f1 release/ui.zip.sha256)"
          committed="$(jq -r .ui.bundle.sha256 filex-app.json)"
          echo "built:     $built"
          echo "committed: $committed"
          if [ "$built" != "$committed" ]; then
            echo "filex-app.json does not carry this build's hash: run 'npm run build && node scripts/pack-ui.mjs --stamp' and commit" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: filextext-ui
          path: |
            release/ui.zip
            release/ui.zip.sha256
            filex-app.json
          retention-days: 7
